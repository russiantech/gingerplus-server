{% extends "base.html" %}{% block content %}
<h2 style="margin:0 0 8px">Order {{ order.number }} update</h2>
<p>Status: <strong>{{ order.status.value|replace('_',' ')|title }}</strong></p>
{% if note %}<p>{{ note }}</p>{% endif %}
<p><a href="{{ site_url }}/track-order?number={{ order.number }}" style="background:#e8a317;color:#3a2a14;padding:12px 22px;border-radius:8px;text-decoration:none;font-weight:700">Track your order</a></p>
{% endblock %}
