{% extends "base.html" %}{% block content %}
<h2 style="margin:0 0 8px">Verify your email</h2>
<p>Hi {{ first_name }}, use this code to finish creating your Southern Rose account:</p>
<div style="font-size:34px;letter-spacing:8px;font-weight:700;background:#fff4d6;border:1px dashed #e8a317;border-radius:10px;padding:14px;text-align:center;color:#7f4e1a">{{ code }}</div>
<p style="color:#8a7352;font-size:13px">The code expires in {{ minutes }} minutes. If you didn't request it, ignore this email.</p>
{% endblock %}
